name: Build Win x64 to Release

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-win-release.yml"
      - "agent/**"
      - "assets/**"
      - "config/config.json"
      - "tools/install.py"
      - "**.py"
    branches:
      - "**"

permissions:
  contents: write

env:
  MAA_FRAMEWORK_VERSION: "v5.12.2"
  MFAA_VERSION: "v2.16.0"
  PYTHON_VERSION: "3.12.10"
  REL_TAG: "v0.1.6"

jobs:
  build-win-x64:
    # 全流程只做文件拷贝/下载，不执行 Windows 二进制，
    # 跑在 ubuntu 上（1x 分钟，windows 2x），产物与本地验证一致。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download MaaFramework (win-x64)
        run: |
          mkdir -p deps
          curl -sL --retry 3 -o /tmp/maa.zip \
            "https://github.com/MaaXYZ/MaaFramework/releases/download/${{ env.MAA_FRAMEWORK_VERSION }}/MAA-win-x86_64-${{ env.MAA_FRAMEWORK_VERSION }}.zip"
          unzip -qo /tmp/maa.zip -d deps || test $? -le 1  # unzip warning(中文文件名)返回1也放行

      - name: Download MFAAvalonia (win-x64)
        run: |
          mkdir -p MFA
          curl -sL --retry 3 -o /tmp/mfa.zip \
            "https://github.com/MaaXYZ/MFAAvalonia/releases/download/${{ env.MFAA_VERSION }}/MFAAvalonia-${{ env.MFAA_VERSION }}-win-x64.zip"
          unzip -qo /tmp/mfa.zip -d MFA || test $? -le 1  # 同上
          rm -f MFA/*.7z MFA/*.zip 2>/dev/null || true

      - name: Setup Windows embed Python
        run: |
          mkdir -p install/python
          curl -sL --retry 3 -o /tmp/emb.zip \
            "https://www.python.org/ftp/python/${{ env.PYTHON_VERSION }}/python-${{ env.PYTHON_VERSION }}-embed-amd64.zip"
          unzip -qo /tmp/emb.zip -d install/python || test $? -le 1  # 同上
          python3 - <<'EOF'
          import glob
          p = glob.glob('install/python/python3*._pth')[0]
          t = open(p).read().replace('#import site', 'import site')
          for line in ['.', 'Lib', 'Lib\\site-packages', 'DLLs']:
              if line not in t.splitlines():
                  t += '\n' + line
          open(p, 'w').write(t)
          print('pth OK:', p)
          EOF

      - name: Download Windows wheels
        run: |
          mkdir -p install/deps
          # 全部依赖（含 opencv）统一走 pip download。
          # 不要手写 files.pythonhosted.org 直链：URL 变更/被拦时只会落下一个
          # 几百字节的错误页，被当成 wheel 后离线安装整步失败（历史事故根因）。
          python3 -m pip download -q -r requirements.txt -d install/deps \
            --only-binary=:all: --platform win_amd64 --python-version 312 \
            --implementation cp --abi cp312
          ls install/deps/*.whl | wc -l
          ls -la install/deps | head -5

      - name: Pre-install wheels into embed Python (offline, no pip at runtime)
        run: |
          python3 -m pip install -q --no-index --find-links install/deps \
            --platform win_amd64 --python-version 312 --implementation cp --abi cp312 \
            --target install/python/Lib/site-packages --only-binary=:all: \
            -r requirements.txt
          rm -rf install/python/Lib/site-packages/bin
          # 给嵌入式 python 补 pip 包体(不运行 exe,只解包,供 Windows 端 python -m pip 使用)
          curl -sL --retry 3 -o /tmp/pip.whl "$(python3 -c "import urllib.request,json; print(json.load(urllib.request.urlopen('https://pypi.org/pypi/pip/json'))['urls'][0]['url'])")"
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/pip.whl').extractall('install/python/Lib/site-packages')"

      - name: Verify pre-installed dependencies (gate)
        run: python3 tools/ci/verify_embed_deps.py install/python/Lib/site-packages

      - name: Install
        run: |
          python3 ./tools/install.py ${{ env.REL_TAG }} win-x64
          cp -rn tools/registry/. install/
          if [ -d "MFA" ]; then
            cp -rn MFA/. install/
            if [ -f "install/MFAAvalonia.exe" ]; then
              mv -f install/MFAAvalonia.exe install/Maa_MHXY_MG.exe
            fi
          fi
          if [ -f "Maa_MHXY_MG.ico" ]; then
            cp Maa_MHXY_MG.ico install/logo.ico
          fi
          # install.py 在 linux 下写 child_exec=python3，改回 Windows 内嵌路径
          python3 -c "
          import json
          p='install/interface.json'; d=json.load(open(p,encoding='utf-8'))
          d['agent']['child_exec']='./python/python.exe'
          json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=4)
          print('child_exec:', d['agent']['child_exec'], '| tasks:', len(d['task']))"

      - name: Package and upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          python3 tools/ci/package.py install Maa_MHXY_MG-win-x86_64-MFAA.zip
          # 上传前先验包：产物必须真的带预装依赖，否则宁可让 CI 红，
          # 也不要用坏包覆盖 Release 上已有的好包。
          python3 tools/ci/verify_package.py Maa_MHXY_MG-win-x86_64-MFAA.zip
          gh release upload "${{ env.REL_TAG }}" "Maa_MHXY_MG-win-x86_64-MFAA.zip" \
            --repo "${{ github.repository }}" --clobber
          echo "Uploaded to ${{ env.REL_TAG }}"
          gh release view "${{ env.REL_TAG }}" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[]|{name,size}'
